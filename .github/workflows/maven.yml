name: Deploy Config Server (Infra)

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - uses: actions/checkout@v4

      # 2. JDK 21 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Maven 빌드
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4. Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Docker 이미지 빌드 및 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/config-server:latest

      # 6. 서버 접속 및 배포 (기존 컨테이너 중단 후 재시작)
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_IP }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PW }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "🚀 Config Server(Infra) 배포 시작..."
            cd ~/www/nhnbook

            SERVICE_NAME="config_server"      # Compose 서비스명
            CONTAINER_NAME="team5-config-server"  # 기존 컨테이너 이름

            echo "🛑 기존 컨테이너 중지..."
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true

            echo "📥 최신 이미지 다운로드..."
            docker-compose pull $SERVICE_NAME

            echo "🔄 컨테이너 시작..."
            docker-compose up -d --no-deps $SERVICE_NAME

            echo "🧹 사용하지 않는 이미지 정리..."
            docker image prune -f

            echo "✅ Config Server 배포 완료!"

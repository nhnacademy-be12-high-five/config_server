server:
  port: 8888

spring:
  application:
    name: config-sever

  cloud:
    config:
      server:
        git:
          uri: https://github.com/your-username/yml_warehouse.git
          username: ${GITHUB_USERNAME}
          password: ${GITHUB_TOKEN}
          clone-on-start: true


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}